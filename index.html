<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Створити новий обліковий запис</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-container">
        <h2>Створити новий обліковий запис</h2>
        <form action="#" method="POST">
            <label for="login">Логін</label>
            <input type="text" id="login" name="login" placeholder="Логін" required>

            <label for="email">Електронна скринька</label>
            <input type="email" id="email" name="email" placeholder="Електронна скринька" required>

            <label for="password">Пароль</label>
            <input type="password" id="password" name="password" placeholder="Пароль" required>

            <button type="submit">Відправити</button>
        </form>
    </div>

</body>
</html>
